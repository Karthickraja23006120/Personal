<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Learning & Work OS 2026–2029</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 10 10%22><text y=%229%22 font-size=%229%22>🧭</text></svg>">
<style>
:root{color-scheme:dark;--bg:#0A0A0A;--tx:#F5F5F5;--t2:#A3A3A3;--bd:#262626;--cd:#111111;--hi:#FFFFFF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#0A0A0A}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1040px;margin:auto;padding:14px}h1{font-size:19px;margin:0;letter-spacing:-.2px}h2{font-size:15px;margin:0 0 8px}
nav{display:flex;gap:6px;overflow-x:auto;margin:12px 0;padding-bottom:4px}nav button{white-space:nowrap}
button{background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 11px;font:inherit;cursor:pointer}
button:hover{border-color:var(--t2)}button.on,button.p{background:var(--hi);color:#000;border-color:var(--hi)}
input,select,textarea{background:#0d0d0d;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;font:inherit;max-width:100%}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.g .card{margin:0}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.mut{color:var(--t2);font-size:12px}.big{font-size:26px;font-weight:600;line-height:1.2}
.bar{height:6px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--hi)}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--bd);flex-wrap:wrap}
.tag{border:1px solid var(--bd);border-radius:20px;padding:0 7px;font-size:11px;color:var(--t2);margin-left:4px}
.acts{display:flex;gap:4px;flex-wrap:wrap;align-items:center}.acts button{padding:3px 8px;font-size:12px}
.f{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.f label{display:grid;gap:2px;font-size:12px;color:var(--t2)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:8px 14px;border-radius:8px;z-index:9;max-width:90%}
textarea{width:100%;min-height:110px;font:12px monospace}
</style></head><body><main id="app"></main>
<script>
const $=s=>document.querySelector(s),V=id=>document.getElementById(id).value,KEY='lwos-v1',
CATS=['Excel','SQL','Python','Statistics','Power BI','Business Analytics','Data Analytics','Machine Learning','AI and LLMs','Projects','Certifications','Communication & Prof. Dev'],

TABS=['Overview','Tasks','Week','Schedule','Health','Learning','Roadmap','Analytics','Me'],LIFE=['Fitness','Sports','Office','College','Personal'],DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],
REAS=['','Work ran late','Travel','Low energy','Unexpected commitment','Other'];
let S,tab='Overview',prop=null,msg='',io='',sv='day',flt={q:'',st:'all',cat:'all',pri:'all'};
const pad=n=>String(n).padStart(2,'0'),uid=()=>Math.random().toString(36).slice(2,9);
function nowIn(tz){const p={};new Intl.DateTimeFormat('en-CA',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value);return p.year+'-'+p.month+'-'+p.day+'T'+p.hour+':'+p.minute}
const D=s=>{const[a,b]=s.split('T'),[y,m,d]=a.split('-').map(Number),[h,i]=(b||'00:00').split(':').map(Number);return Date.UTC(y,m-1,d,h,i)/6e4},
F=m=>{const d=new Date(m*6e4);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())},
lab=m=>{const d=new Date(m*6e4);return d.toUTCString().slice(0,11)+' '+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())},
tm=s=>{const[h,m]=s.split(':').map(Number);return h*60+m},now=()=>D(nowIn(S.tz)),day=m=>Math.floor(m/1440)*1440,

stt=t=>act(t)&&D(t.due)<now()?'overdue':t.status,nm=x=>x.tid&&tk(x.tid)?tk(x.tid).title:(x.note||x.cat),

bar=p=>`<div class=bar><i style="width:${Math.max(0,Math.min(100,Math.round(p)))}%"></i></div>`,
stat=(k,v,s='')=>`<div class=card><div class=mut>${k}</div><div class=big>${v}</div>${s}</div>`,
li=(a,e='Nothing yet')=>a.length?a.map(x=>`<div class=row>${x}</div>`).join(''):`<div class=mut>${e}</div>`,
sel=(id,o,v,x='')=>`<select id="${id}" ${x}>${o.map(y=>`<option${y==v?' selected':''}>${y}</option>`).join('')}</select>`,
dsess=()=>S.sess.filter(x=>x.status==='done');
function sample(){const tz='Asia/Kolkata',n=D(nowIn(tz)),d0=day(n),at=(o,h,m=0)=>F(d0+o*1440+h*60+m),
T=(title,cat,pri,dur,o,h,x={})=>({id:uid(),title,cat,pri,dur,due:at(o,h),notes:'',status:'pending',...x}),
t=[T('SQL joins practice','SQL','high',90,2,21),T('Pandas data cleaning notebook','Python','medium',120,4,21),T('Power BI sales dashboard','Power BI','high',150,6,21),T('Statistics: hypothesis testing','Statistics','medium',90,5,18),T('Excel pivot tables revision','Excel','low',60,-1,21),T('Update LinkedIn headline','Communication & Prof. Dev','low',45,8,20),T('Linear regression notes','Machine Learning','medium',90,9,20),T('Portfolio project outline','Projects','high',120,-2,21,{status:'done',doneAt:at(-2,21)})],
s=(i,o,h,dur,status,x={})=>({id:uid(),tid:t[i].id,cat:t[i].cat,start:at(o,h),dur,status,...x});
return{tz,sample:1,loc:'Home',st:'Available',pg:{sub:'',uni:'',intake:''},tasks:t,
sess:[s(7,-2,19,120,'done'),s(3,-3,20,60,'done'),s(0,-1,19,60,'done'),s(4,-1,21,60,'missed',{reason:'Work ran late'}),s(0,1,19,90,'scheduled'),s(1,3,19,120,'scheduled')],
win:[1,2,3,4,5].map(d=>({id:uid(),day:d,from:'19:00',to:'22:00'})).concat([0,6].flatMap(d=>[{id:uid(),day:d,from:'09:00',to:'12:00'},{id:uid(),day:d,from:'15:00',to:'18:00'}])),
busy:[{id:uid(),title:'Family call',type:'Personal',start:at(2,19),end:at(2,20)},{id:uid(),title:'College exam',type:'College',start:at(5,9),end:at(5,17)}],
rec:[1,3].map(d=>({id:uid(),title:'Office hours (sample)',type:'Office',day:d,from:'09:00',to:'13:00'})),ms:[[0,'Complete final-year coursework','2027-05-31'],[1,'Reach 12 months of data experience','2027-07-31'],[2,'Comfortable with SQL and Power BI','2026-12-31'],[3,'Publish 3 portfolio projects','2027-03-31'],[4,'Refresh resume and LinkedIn','2026-11-30'],[5,'Check whether an English test is required',''],[6,'Shortlist universities (subject undecided)',''],[7,'List application deadlines',''],[8,'Draft budget and funding plan','']].map(([g,t,d])=>({id:uid(),g,t,d,done:0}))}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
function up(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}
function recIv(a,b){const o=[];for(let d=day(a);d<b;d+=1440){const wd=new Date(d*6e4).getUTCDay();S.rec.filter(r=>+r.day===wd).forEach(r=>o.push({s:d+tm(r.from),e:d+tm(r.to),r}))}return o}
function cands(t){const n=now(),end=Math.min(D(t.due),n+30*1440),busy=[...S.busy.map(b=>[D(b.start),D(b.end)]),...recIv(day(n),end).map(r=>[r.s,r.e]),...S.sess.filter(x=>x.status==='scheduled').map(x=>[D(x.start),D(x.start)+x.dur])].sort((a,b)=>a[0]-b[0]),out=[];
for(let d=day(n);d<end;d+=1440){const wd=new Date(d*6e4).getUTCDay(),load=busy.reduce((s,b)=>s+Math.max(0,Math.min(b[1],d+1440)-Math.max(b[0],d)),0);
(t.wf?(t.wd||[0,1,2,3,4,5,6]).map(x=>({day:x,from:t.wf,to:t.wt})):S.win).filter(w=>+w.day===wd).forEach(w=>{const s=Math.max(d+tm(w.from),Math.ceil(n/15)*15),e=Math.min(d+tm(w.to),end);let cur=s,ok=0;
for(const b of busy){if(b[1]<=cur||b[0]>=e)continue;if(b[0]-cur>=t.dur){ok=1;break}cur=Math.max(cur,b[1])}
if(ok||e-cur>=t.dur)out.push({s:cur,load,slack:(D(t.due)-cur-t.dur)/1440})})}
out.sort((a,b)=>t.pri==='high'?a.s-b.s:(a.load-b.load)||(a.s-b.s));const seen={},r=[];
for(const c of out){const k=day(c.s);if(seen[k])continue;seen[k]=1;r.push({...c,why:(t.pri==='high'?'High priority, so the earliest fit':'The least-booked day available')+`. ${h1(c.load/60)} already booked that day; ends ${c.slack.toFixed(1)} days before the deadline.`});if(r.length==3)break}
return r}
const wk0=n=>day(n)-((new Date(n*6e4).getUTCDay()+6)%7)*1440,wkDone=(g,w0)=>S.tasks.filter(t=>t.gid==g.id&&t.status=='done'&&D(t.due)>=w0&&D(t.due)<w0+7*1440).length,seen=new Set();
function alerts(){const n=now(),a=[],w0=wk0(n);S.sess.filter(x=>x.status==='scheduled').forEach(x=>{const m=D(x.start)-n;if(m>=0&&m<=30)a.push(`Starts in ${m} min: ${nm(x)}`);if(m<0&&m>-240)a.push(`Started ${-m} min ago: ${nm(x)}. Mark it Done or Missed.`)});
S.tasks.filter(t=>act(t)&&D(t.due)>=n&&D(t.due)<n+1440).forEach(t=>a.push(`Due within 24 hours: ${t.title}`));const od=S.tasks.filter(t=>act(t)&&D(t.due)<n).length;if(od)a.push(`${od} overdue task${od>1?'s':''}`);
S.goals.forEach(g=>{const left=g.n-wkDone(g,w0),dl=Math.ceil((w0+7*1440-n)/1440);if(left>0&&left>=dl)a.push(`Behind on ${g.title}: ${left} more needed, ${dl} day${dl>1?'s':''} left this week`)});
if(+nowIn(S.tz).slice(11,13)>=20&&!S.hl.log.some(x=>x.d==F(n).slice(0,10)))a.push('Log today\u2019s weight, meals and workout (Health tab)');return a}
function notify(){try{if(Notification.permission!=='granted')return;alerts().forEach(a=>{if(!seen.has(a)){seen.add(a);new Notification('Work OS',{body:a})}})}catch(e){}}
function propose(tid,sid){if(S.sess.some(x=>x.tid==tid&&x.status==='scheduled'&&D(x.start)>=now())){msg='This task already has an upcoming session, so no duplicate was added.';return}
prop={tid,sid,c:cands(tk(tid))};tab='Schedule'}
const V_={
Overview(){const n=now(),d0=day(n),A=S.tasks.filter(act),sc=S.sess.filter(x=>x.status==='scheduled'),by=(a,b)=>D(a.start)-D(b.start),
today=sc.filter(x=>D(x.start)>=d0&&D(x.start)<d0+1440).sort(by),up=sc.filter(x=>D(x.start)>=n).sort(by).slice(0,5),od=A.filter(t=>D(t.due)<n),dn=S.tasks.filter(t=>t.status==='done'),
tot=S.tasks.filter(t=>t.status!=='cancelled').length,rate=tot?Math.round(dn.length/tot*100):0,wk=hrs(dsess().filter(x=>D(x.start)>n-7*1440)),mp=S.ms.length?Math.round(S.ms.filter(m=>m.done).length/S.ms.length*100):0,
dl=A.slice().sort((a,b)=>D(a.due)-D(b.due)).slice(0,5);
return`<div class=g>${stat('Pending',A.length)}${stat('Overdue',od.length)}${stat('Completed',dn.length)}${stat('Learning, last 7 days',h1(wk))}${stat('Completion rate',rate+'%',bar(rate))}${stat('2029 goals',mp+'%',bar(mp))}</div>
<div class="g g2"><div class=card><h2>Today’s sessions</h2>${li(today.map(x=>`${lab(D(x.start)).slice(12)} · ${esc(nm(x))} · ${x.dur} min`),'No sessions today')}</div>
<div class=card><h2>Upcoming</h2>${li(up.map(x=>`${lab(D(x.start))} · ${esc(nm(x))}`),'Nothing scheduled')}</div>
<div class=card><h2>Overdue</h2>${li(od.map(t=>`${esc(t.title)} <span class=mut>due ${lab(D(t.due))}</span>`),'Nothing overdue')}</div>
<div class=card><h2>Next deadlines</h2>${li(dl.map(t=>`${esc(t.title)} <span class=mut>${lab(D(t.due))}</span>`),'No open tasks')}</div></div>`},
Tasks(){const n=now(),e=S.edit&&tk(S.edit)||{title:'',cat:CATS[0],pri:'medium',dur:60,due:F(day(n)+2*1440+21*60),notes:''},
L=S.tasks.filter(t=>(!flt.q||(t.title+t.notes).toLowerCase().includes(flt.q.toLowerCase()))&&(flt.cat=='all'||t.cat==flt.cat)&&(flt.pri=='all'||t.pri==flt.pri)&&(flt.st=='all'||(flt.st=='open'?act(t):stt(t)==flt.st))).sort((a,b)=>D(a.due)-D(b.due)),
H=S.tasks.filter(t=>t.status==='done').sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||''));
return`<div class=card><h2>${S.edit?'Edit task':'Add task'}</h2><div class=f><label>Title<input id=tt value="${esc(e.title)}"></label><label>Category${sel('tc',[...CATS,...LIFE],e.cat)}</label><label>Priority${sel('tp',['high','medium','low'],e.pri)}</label><label>Minutes<input id=td type=number min=5 step=5 value=${e.dur} style="width:80px"></label><label>Deadline<input id=tdue type=datetime-local value="${e.due}"></label><label>Notes<input id=tn value="${esc(e.notes)}"></label><button class=p data-a=saveTask>${S.edit?'Save changes':'Add task'}</button>${S.edit?'<button data-a=noedit>Cancel edit</button>':''}</div></div>
<div class=card><div class=f><label>Search<input id=fq value="${esc(flt.q)}" placeholder="Title or notes"></label><label>Status${sel('fs',['all','open','overdue','pending','rescheduled','done','cancelled'],flt.st,'data-f=xst')}</label><label>Category${sel('fc',['all',...CATS,...LIFE],flt.cat,'data-f=xcat')}</label><label>Priority${sel('fp',['all','high','medium','low'],flt.pri,'data-f=xpri')}</label></div>
${li(L.map(t=>`<div><b>${esc(t.title)}</b><span class=tag>${esc(t.cat)}</span><span class=tag>${t.pri}</span><span class=tag>${stt(t)}</span><div class=mut>Due ${lab(D(t.due))} · ${t.dur} min${t.notes?' · '+esc(t.notes):''}</div></div><div class=acts>${act(t)?`<button data-a=done data-i=${t.id}>Done</button><button data-a=slot data-i=${t.id}>Find a time</button>`:''}<button data-a=edit data-i=${t.id}>Edit</button>${act(t)?`<button data-a=cancel data-i=${t.id}>Cancel</button>`:''}<button data-a=del data-i=${t.id}>Delete</button></div>`),'No tasks match these filters.')}</div>
<div class=card><h2>Completion history</h2>${li(H.map(t=>`${esc(t.title)} <span class=mut>completed ${t.doneAt?lab(D(t.doneAt)):''}</span>`),'Completed tasks appear here.')}</div>`},
Week(){const n=now(),w0=wk0(n);return`<div class=card><h2>Weekly goals</h2><div class=mut>Each goal repeats every week. Plan this week creates only the tasks still missing. Then use Find a time on each task and approve the proposed slot.</div>${li(S.goals.map(g=>{const d=wkDone(g,w0);return`<div><b>${esc(g.title)}</b><span class=tag>${esc(g.cat)}</span><div class=mut>${g.dur} min × ${g.n} per week · ${g.wf}–${g.wt} · ${g.wd.map(i=>DAYS[i]).join(', ')}</div>${bar(d/g.n*100)}<div class=mut>${d}/${g.n} done this week</div></div><div class=acts><button data-a=delgoal data-i=${g.id}>Remove</button></div>`}),'No weekly goals yet')}<button class=p data-a=plan style="margin-top:8px">Plan this week</button></div>
<div class=card><h2>Add weekly goal</h2><div class=f><label>Title<input id=gt></label><label>Category${sel('gc',[...LIFE,...CATS],'Fitness')}</label><label>Minutes<input id=gm type=number min=15 step=15 value=60 style="width:80px"></label><label>Times per week<input id=gn type=number min=1 max=14 value=1 style="width:70px"></label><label>Priority${sel('gp',['high','medium','low'],'medium')}</label><label>Earliest<input id=gf type=time value="06:00"></label><label>Latest end<input id=gtt type=time value="22:00"></label></div><div class=f style="margin-top:8px">${DAYS.map((d,i)=>`<label style="display:flex;gap:3px;align-items:center"><input type=checkbox class=gdc value=${i} checked>${d}</label>`).join('')}<button class=p data-a=addgoal>Add goal</button></div></div>`},
Health(){const n=now(),t0=F(n).slice(0,10),L=S.hl.log.slice().sort((a,b)=>b.d.localeCompare(a.d)),r=L.filter(x=>D(x.d)>=day(n)-6*1440),av=k=>{const q=r.filter(x=>x[k]);return q.length?Math.round(q.reduce((s,x)=>s+x[k],0)/q.length):0},ws=L.filter(x=>x.w),dw=ws.length>1?ws[0].w-ws[ws.length-1].w:0,H=S.hl;

<div class=card><h2>Daily log</h2><div class=f><label>Date<input id=hd type=date value="${t0}"></label><label>Weight kg<input id=hw type=number step=0.1 style="width:90px"></label><label>Calories<input id=hk type=number style="width:90px"></label><label>Protein g<input id=hp type=number style="width:80px"></label><label>Water L<input id=hq type=number step=0.5 style="width:80px"></label><label>Workout${sel('hg',['Done','Rest','Skipped'],'Done')}</label><button class=p data-a=hlog>Save entry</button></div><div class=mut>Saving a date that already has an entry replaces it.</div></div>

<div class=card><h2>Recent entries</h2>${li(L.slice(0,10).map(x=>`${x.d} · ${x.w?x.w+' kg · ':''}${x.kcal} kcal · ${x.prot} g protein · ${x.water} L · ${x.gym}`),'No entries yet')}</div>

Schedule(){const n=now(),d0=day(n),to=d0+(sv=='day'?1:7)*1440,
ev=[...S.sess.filter(x=>x.status!=='cancelled'&&D(x.start)>=d0&&D(x.start)<to).map(x=>({s:D(x.start),x})),...S.busy.filter(b=>D(b.start)<to&&D(b.end)>d0).map(b=>({s:D(b.start),b})),...recIv(d0,to).map(o=>({s:o.s,b:{title:o.r.title,type:o.r.type+' · weekly',end:F(o.e)}}))].sort((a,b)=>a.s-b.s);
const P=prop?`<div class=card><h2>Proposed times for “${esc(tk(prop.tid).title)}”</h2><div class=mut>Nothing is booked until you approve. The original deadline (${lab(D(tk(prop.tid).due))}) stays the same.</div>${li(prop.c.map((c,i)=>`<div><b>${lab(c.s)}</b> · ${tk(prop.tid).dur} min<div class=mut>${c.why}</div></div><div class=acts><button class=p data-a=approve data-i=${i}>Approve</button></div>`),'No free slot before the deadline. Widen your availability windows or move the deadline.')}<button data-a=reject>Reject all</button></div>`:'';
return P+`<div class=card><div class=acts><button class="${sv=='day'?'on':''}" data-a=sv data-i=day>Today</button><button class="${sv=='week'?'on':''}" data-a=sv data-i=week>Next 7 days</button></div>
${li(ev.map(o=>o.x?`<div><b>${lab(o.s)}</b> · ${esc(nm(o.x))} · ${o.x.dur} min<span class=tag>${o.x.status}${o.x.resched?' → rescheduled':''}</span>${o.x.reason?`<div class=mut>Reason: ${esc(o.x.reason)}</div>`:''}</div><div class=acts>${o.x.status=='scheduled'?`${sel('r_'+o.x.id,REAS,'')}<button data-a=sdone data-i=${o.x.id}>Done</button><button data-a=miss data-i=${o.x.id}>Missed</button>`:o.x.status=='missed'&&!o.x.resched&&o.x.tid&&tk(o.x.tid)&&act(tk(o.x.tid))?`<button data-a=slot data-i=${o.x.tid} data-s=${o.x.id}>Find a new time</button>`:''}</div>`:`<div><b>${lab(o.s)}</b> · ${esc(o.b.title)}<span class=tag>${o.b.type}</span><div class=mut>until ${lab(D(o.b.end))}</div></div>`),'Nothing scheduled in this range.')}</div>
<div class="g g2"><div class=card><h2>Available time windows (weekly)</h2><div class=mut>Sessions are only suggested inside these windows.</div>${li(S.win.slice().sort((a,b)=>a.day-b.day||a.from.localeCompare(b.from)).map(w=>`${DAYS[w.day]} ${w.from}–${w.to}<button data-a=delwin data-i=${w.id}>Remove</button>`),'No windows yet')}
<div class=f style="margin-top:8px"><label>Day${sel('wd',['Every day',...DAYS],'Every day')}</label><label>From<input id=wf type=time value="19:00"></label><label>To<input id=wt type=time value="21:00"></label><button class=p data-a=addwin>Add window</button></div></div>
<div class=card><h2>Weekly commitments (repeat every week)</h2><div class=mut>Office hours, classes or regular travel. Sessions are never suggested during these times.</div>${li(S.rec.slice().sort((a,b)=>a.day-b.day||a.from.localeCompare(b.from)).map(r=>`${esc(r.title)}<span class=tag>${r.type}</span> <span class=mut>${DAYS[r.day]} ${r.from}–${r.to}</span><button data-a=delrec data-i=${r.id}>Remove</button>`),'None yet')}<div class=f style="margin-top:8px"><label>Title<input id=rt></label><label>Type${sel('rp',['Office','College','Personal','Travel'],'Office')}</label><label>From<input id=rf type=time value="09:00"></label><label>To<input id=rtt type=time value="13:00"></label></div><div class=f style="margin-top:8px">${DAYS.map((d,i)=>`<label style="display:flex;gap:3px;align-items:center"><input type=checkbox class=rdc value=${i}>${d}</label>`).join('')}<button class=p data-a=addrec>Add weekly</button></div></div>
<div class=card><h2>One-off commitments (office, college, personal, travel)</h2>${li(S.busy.slice().sort((a,b)=>D(a.start)-D(b.start)).map(b=>`${esc(b.title)}<span class=tag>${b.type}</span> <span class=mut>${lab(D(b.start))} – ${lab(D(b.end)).slice(12)}</span><button data-a=delbusy data-i=${b.id}>Remove</button>`),'None yet')}
<div class=f style="margin-top:8px"><label>Title<input id=bt></label><label>Type${sel('bp',['Office','College','Personal','Travel'],'Office')}</label><label>Start<input id=bs type=datetime-local></label><label>End<input id=be type=datetime-local></label><button class=p data-a=addbusy>Add</button></div></div></div>`},
Learning(){const dn=dsess(),mx=Math.max(1,...CATS.map(c=>hrs(dn.filter(x=>x.cat==c))));
return`<div class=card><h2>Log a study session</h2><div class=f><label>Category${sel('lc',CATS,CATS[1])}</label><label>Started<input id=ls type=datetime-local value="${F(now())}"></label><label>Minutes<input id=lm type=number min=5 step=5 value=60 style="width:80px"></label><label>Notes<input id=ln></label><button class=p data-a=log>Log session</button></div></div>
<div class=g>${CATS.map(c=>{const x=dn.filter(s=>s.cat==c),ts=S.tasks.filter(t=>t.cat==c&&t.status!=='cancelled');return stat(esc(c),h1(hrs(x)),`${bar(hrs(x)/mx*100)}<div class=mut>${x.length} sessions · ${ts.filter(t=>t.status=='done').length}/${ts.length} tasks done</div>`)}).join('')}</div>
<div class=card><h2>Recent sessions and notes</h2>${li(dn.slice().sort((a,b)=>D(b.start)-D(a.start)).slice(0,8).map(x=>`${lab(D(x.start))} · ${esc(x.cat)} · ${x.dur} min${x.note?' · '+esc(x.note):''}`),'Logged sessions appear here.')}</div>`},
Roadmap(){const p=S.ms.length?Math.round(S.ms.filter(m=>m.done).length/S.ms.length*100):0;
return`<div class=card><h2>Postgraduate plan</h2><div class=mut>Left blank on purpose. Fill these in when you have decided.</div><div class=f><label>Subject<input data-f=pg.sub value="${esc(S.pg.sub)}" placeholder="Not decided"></label><label>University<input data-f=pg.uni value="${esc(S.pg.uni)}" placeholder="Not decided"></label><label>Intake<input data-f=pg.intake value="${esc(S.pg.intake)}" placeholder="Not decided"></label></div>${bar(p)}<div class=mut>${p}% of milestones complete</div></div>
${GR.map((g,i)=>`<div class=card><h2>${g}</h2>${li(S.ms.filter(m=>m.g==i).map(m=>`<div class=acts><input type=checkbox aria-label="Done" ${m.done?'checked':''} data-a=tms data-i=${m.id}><input data-f=ms.t data-i=${m.id} value="${esc(m.t)}" style="width:min(340px,60vw)"><input type=date data-f=ms.d data-i=${m.id} value="${m.d}"><button data-a=delms data-i=${m.id}>Remove</button></div>`),'No milestones yet')}<div class=f style="margin-top:8px"><input id=mn${i} placeholder="New milestone"><button data-a=addms data-i=${i}>Add milestone</button></div></div>`).join('')}`},
Analytics(){const n=now(),dn=dsess(),days=new Set(dn.map(x=>Math.floor(D(x.start)/1440)));let d=Math.floor(n/1440),st=0;if(!days.has(d))d--;while(days.has(d)){st++;d--}
const W=[0,1,2,3].map(w=>{const a=n-(w+1)*7*1440,b=n-w*7*1440,x=S.sess.filter(s=>D(s.start)>=a&&D(s.start)<b&&s.status!=='cancelled');return{w,pl:hrs(x),dn:hrs(x.filter(s=>s.status=='done')),ms:x.filter(s=>s.status=='missed').length}}),
mo=F(n).slice(0,7),mh=hrs(dn.filter(x=>x.start.slice(0,7)==mo)),tot=S.tasks.filter(t=>t.status!=='cancelled').length,rate=tot?Math.round(S.tasks.filter(t=>t.status=='done').length/tot*100):0,
mx=Math.max(1,...W.map(x=>x.pl)),sk=CATS.map(c=>[c,hrs(dn.filter(x=>x.cat==c))]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
return`<div class=g>${stat('Learning streak',st+' days')}${stat('This month',h1(mh))}${stat('Completion rate',rate+'%',bar(rate))}${stat('Open tasks',S.tasks.filter(act).length)}</div>
<div class=card><h2>Planned vs completed hours (weekly)</h2>${li(W.map(x=>`${x.w?x.w+' week'+(x.w>1?'s':'')+' ago':'Last 7 days'}: ${h1(x.dn)} done of ${h1(x.pl)} planned · ${x.ms} missed${bar(x.pl?x.dn/mx*100:0)}`))}</div>
<div class="g g2"><div class=card><h2>Progress by skill</h2>${li(sk.map(([c,h])=>`${esc(c)}: ${h1(h)}${bar(h/sk[0][1]*100)}`),'Complete a session to see skill progress.')}</div>
<div class=card><h2>Milestones</h2>${li(GR.map((g,i)=>{const m=S.ms.filter(x=>x.g==i),d=m.filter(x=>x.done).length;return`${g}: ${d}/${m.length}${bar(m.length?d/m.length*100:0)}`}))}</div></div><div class=mut>All figures are calculated from your own task and session records.</div>`},
Me(){return`<div class=card><h2>Where you are and what you’re doing</h2><div class=mut>Set separately by you. Being at home does not mean you are free.</div><div class=f><label>Location${sel('lo',['Home','Office','College','Travelling','Elsewhere'],S.loc,'data-f=loc')}</label><label>Status${sel('as',['Available','Office','College','Personal commitments','Travelling'],S.st,'data-f=st')}</label></div></div>
<div class=card><h2>Timezone</h2><div class=f><label>IANA timezone<input data-f=tz value="${esc(S.tz)}"></label></div><div class=mut>Stored times are wall-clock times in this zone. Changing it changes what “now” means; it does not shift saved times.</div></div>
<div class=card><h2>Alerts</h2><div class=mut>Alerts appear at the top while this page is open. Phone alerts when it is closed need a Telegram bot, which is the next step.</div><button data-a=notif>Enable browser alerts</button></div>
<div class=card><h2>Data</h2><div class=mut>Saved in this browser only (localStorage). Export a copy to keep a backup.</div><div class=acts style="margin:8px 0"><button data-a=exp>Export JSON</button><button data-a=imp>Import from box</button><button data-a=reset>Reset sample data</button><button data-a=clear>Clear all data</button></div><textarea id=io aria-label="JSON data">${esc(io)}</textarea></div>`}};
function render(){const a=document.activeElement&&document.activeElement.id;
$('#app').innerHTML=`<h1>Learning & Work OS · 2026–2029</h1><div class=mut>${lab(now())} (${esc(S.tz)}) · ${esc(S.loc)} · ${esc(S.st)}</div><nav>${TABS.map(t=>`<button class="${t==tab?'on':''}" data-a=tab data-i="${t}">${t}</button>`).join('')}</nav>${alerts().length?`<div class=card role=status><h2>Alerts</h2>${alerts().map(a=>`<div class=row>${esc(a)}</div>`).join('')}</div>`:''}${S.sample?'<div class="card mut">Sample data: replace or clear it under Me → Data.</div>':''}${V_[tab]()}${msg?`<div class=toast role=status>${esc(msg)}</div>`:''}`;
if(msg){setTimeout(()=>{const t=$('.toast');t&&t.remove()},3500);msg=''}
if(a=='fq'){const e=$('#fq');e.focus();e.setSelectionRange(e.value.length,e.value.length)}}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b||b.tagName=='INPUT'&&b.type!='checkbox')return;const a=b.dataset.a,i=b.dataset.i,n=now();
switch(a){case'tab':tab=i;prop=null;break;case'sv':sv=i;break;
case'saveTask':{const o={title:V('tt').trim(),cat:V('tc'),pri:V('tp'),dur:+V('td')||30,due:V('tdue'),notes:V('tn')};if(!o.title||!o.due){msg='Add a title and a deadline.';break}
if(S.edit){Object.assign(tk(S.edit),o);S.edit=null}else if(S.tasks.some(t=>act(t)&&t.title.toLowerCase()==o.title.toLowerCase()&&t.cat==o.cat)){msg='An open task with this title already exists, so nothing was added.';break}else S.tasks.push({id:uid(),status:'pending',...o});break}
case'edit':S.edit=i;break;case'noedit':S.edit=null;break;
case'done':{const t=tk(i);t.status='done';t.doneAt=F(n);break}
case'cancel':tk(i).status='cancelled';S.sess.forEach(x=>{if(x.tid==i&&x.status=='scheduled')x.status='cancelled'});break;
case'del':S.tasks=S.tasks.filter(t=>t.id!=i);S.sess=S.sess.filter(x=>x.tid!=i);break;
case'slot':propose(i,b.dataset.s);break;
case'approve':{const c=prop.c[i],t=tk(prop.tid);S.sess.push({id:uid(),tid:t.id,cat:t.cat,start:F(c.s),dur:t.dur,status:'scheduled'});if(prop.sid){const o=S.sess.find(x=>x.id==prop.sid);if(o)o.resched=1;t.status='rescheduled'}prop=null;msg='Session booked.';break}
case'reject':prop=null;msg='No change made. The task stays pending.';break;
case'sdone':{const s=S.sess.find(x=>x.id==i);s.status='done';break}
case'miss':{const s=S.sess.find(x=>x.id==i);s.status='missed';s.reason=V('r_'+i);const t=tk(s.tid);if(t&&act(t))t.status='pending';if(t)propose(t.id,s.id);break}
case'addwin':{const v=V('wd');(v=='Every day'?[0,1,2,3,4,5,6]:[DAYS.indexOf(v)]).forEach(d=>S.win.push({id:uid(),day:d,from:V('wf'),to:V('wt')}))}break;case'delwin':S.win=S.win.filter(w=>w.id!=i);break;
case'addbusy':{const o={id:uid(),title:V('bt').trim(),type:V('bp'),start:V('bs'),end:V('be')};if(!o.title||!o.start||!o.end||D(o.end)<=D(o.start)){msg='Add a title and a valid start and end.';break}S.busy.push(o);break}
case'delbusy':S.busy=S.busy.filter(w=>w.id!=i);break;
case'addrec':{const ds=[...document.querySelectorAll('.rdc:checked')].map(x=>+x.value),o={title:V('rt').trim(),type:V('rp'),from:V('rf'),to:V('rtt')};if(!o.title||!ds.length||!o.from||!o.to||tm(o.to)<=tm(o.from)){msg='Add a title, at least one day and a valid start and end time.';break}ds.forEach(d=>S.rec.push({id:uid(),day:d,...o}));msg='Weekly commitment added.';break}
case'delrec':S.rec=S.rec.filter(r=>r.id!=i);break;
case'log':{const o={id:uid(),cat:V('lc'),start:V('ls'),dur:+V('lm')||30,status:'done',note:V('ln')};S.sess.push(o);break}
case'tms':{const m=S.ms.find(x=>x.id==i);m.done=m.done?0:1;break}case'delms':S.ms=S.ms.filter(m=>m.id!=i);break;
case'addms':{const t=V('mn'+i).trim();if(!t)break;S.ms.push({id:uid(),g:+i,t,d:'',done:0});break}
case'addgoal':{const ds=[...document.querySelectorAll('.gdc:checked')].map(x=>+x.value),g={id:uid(),title:V('gt').trim(),cat:V('gc'),dur:+V('gm')||60,n:+V('gn')||1,pri:V('gp'),wf:V('gf'),wt:V('gtt'),wd:ds};if(!g.title||!ds.length||tm(g.wt)<=tm(g.wf)){msg='Add a title, at least one day and a valid time window.';break}S.goals.push(g);break}
case'delgoal':S.goals=S.goals.filter(g=>g.id!=i);break;
case'plan':{const w0=wk0(n);let c=0;S.goals.forEach(g=>{const have=S.tasks.filter(t=>t.gid==g.id&&t.status!=='cancelled'&&D(t.due)>=w0&&D(t.due)<w0+7*1440).length;for(let k=have;k<g.n;k++){S.tasks.push({id:uid(),status:'pending',title:g.title+(g.n>1?' #'+(k+1):''),cat:g.cat,pri:g.pri,dur:g.dur,due:F(w0+7*1440-60),notes:'Weekly goal',gid:g.id,wf:g.wf,wt:g.wt,wd:g.wd});c++}});msg=c?c+' tasks added. Use Find a time on each to schedule it.':'This week is already planned.';tab='Tasks';break}
case'hlog':{const o={d:V('hd'),w:+V('hw')||0,kcal:+V('hk')||0,prot:+V('hp')||0,water:+V('hq')||0,gym:V('hg')};if(!o.d){msg='Pick a date.';break}const k=S.hl.log.findIndex(x=>x.d==o.d);if(k>=0){S.hl.log[k]=o;msg='Replaced the entry for '+o.d+'.'}else{S.hl.log.push(o);msg='Entry saved.'}break}
case'notif':try{Notification.requestPermission().then(p=>{msg=p=='granted'?'Browser alerts enabled while this page is open.':'Browser alerts were not allowed.';render()})}catch(e){msg='This browser blocks pop-up alerts here. In-page alerts still work.'}break;
case'exp':io=JSON.stringify(S,null,1);break;
case'imp':try{const o=JSON.parse(V('io'));if(!Array.isArray(o.tasks)||!Array.isArray(o.sess))throw 0;S=norm(o);io='';msg='Data imported.'}catch(e){msg='That JSON is not valid Work OS data.'}break;
case'reset':S=norm(sample());prop=null;msg='Sample data restored.';break;
case'clear':S=norm({...sample(),sample:0,tasks:[],sess:[],busy:[],rec:[],goals:[],ms:[]});prop=null;msg='All data cleared. Your availability windows were kept.'}up()});
document.addEventListener('change',e=>{const f=e.target.dataset.f;if(!f)return;const v=e.target.value,i=e.target.dataset.i;
if(f=='tz'){try{nowIn(v);S.tz=v}catch(x){msg='Unknown timezone. Try Asia/Kolkata.'}}
else if(f.startsWith('hl.'))S.hl[f.slice(3)]=+v||0;else if(f.startsWith('pg.'))S.pg[f.slice(3)]=v;else if(f=='loc'||f=='st')S[f]=v;
else if(f.startsWith('ms.'))S.ms.find(m=>m.id==i)[f[3]]=v;else if(f[0]=='x')flt[f.slice(1)]=v;up()});
document.addEventListener('input',e=>{if(e.target.id=='fq'){flt.q=e.target.value;render()}});
const norm=o=>{o.rec=o.rec||[];o.goals=o.goals||[];o.hl=o.hl||{kcal:1800,prot:110,water:3,log:[]};return o};
S=load();if(!S||!Array.isArray(S.tasks))S=sample();norm(S);render();setInterval(()=>{notify();if(!document.activeElement||!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))render()},60000);
</script></body></html>
